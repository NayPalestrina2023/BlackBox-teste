name: Gerar APK do motor

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar NDK e ferramentas
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.13846066" "platforms;android-34" "build-tools;34.0.0" || true
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Diagnostico do APK
        if: always()
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          for f in $(find . -path "*build/outputs/apk/debug/*.apk"); do
            echo "### $f" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            $AAPT dump badging "$f" | grep -E "^package|sdkVersion|native-code" >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          done
      - uses: actions/upload-artifact@v4
        with:
          name: BlackBox-apk-${{ github.run_number }}
          path: "**/build/outputs/apk/debug/*.apk"
