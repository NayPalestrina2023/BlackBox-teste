name: Gerar APK do motor

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar NDK e ferramentas
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.13846066" "platforms;android-34" "build-tools;34.0.0" || true
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Quem abre e como se chama
        if: always()
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          f=$(find . -name "*arm64*debug.apk" | head -1)
          echo "### O que o APK novo diz" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          $AAPT dump badging "$f" 2>&1 | grep -E "^application-label:|^launchable-activity|^application-icon-" | fold -w 70 | head -12 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: BlackBox-apk-${{ github.run_number }}
          path: "**/build/outputs/apk/debug/*.apk"
